<!-- Footer -->
<footer class="text-center">
  <div class="footer-above">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <ul class="list-inline" style="margin-bottom: 15px;">
            <li style="display: inline-block; margin: 0 15px;">
              <a href="mailto:{{ site.email }}" class="btn-social btn-outline" title="Email">
                <i class="fa-solid fa-fw fa-envelope"></i>
              </a>
            </li>
            {% for platform in site.social %}
              <li style="display: inline-block; margin: 0 15px;">
                <a href="{{ platform.url }}" class="btn-social btn-outline" title="{{ platform.title }}">
                  <i class="fa-brands fa-fw fa-{{ platform.title }}"></i>
                </a>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-below">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          Copyright &copy; {{ site.footer.copyright }} 20{{ site.time | date: '%y' }}
        </div>
      </div>
    </div>
  </div>
</footer>

<!-- Scroll to Top Button (Only visible on small and extra-small screen sizes) -->
<div class="scroll-top page-scroll visible-xs visible-sm">
  <a class="btn btn-primary" href="#page-top">
    <i class="fa fa-chevron-up"></i>
  </a>
</div>
